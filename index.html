<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Call Notifier</title>

<style>
body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:90%;
    max-width:420px;
    background:#1e293b;
    border-radius:20px;
    padding:30px;
    text-align:center;
}

.icon{
    font-size:70px;
}

.type{
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
}

.name{
    margin-top:20px;
    font-size:34px;
}

.number{
    margin-top:10px;
    font-size:22px;
    color:#cbd5e1;
}

.time{
    margin-top:20px;
    color:#94a3b8;
}

.status{
    margin-top:30px;
    color:#22c55e;
}
</style>

</head>

<body>

<div class="card">

<div class="icon" id="icon">📞</div>

<div class="type" id="type">En attente...</div>

<div class="name" id="name">Aucun appel</div>

<div class="number" id="number">---</div>

<div class="time" id="time"></div>

<div class="status">
🟢 Connecté
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCFUl7qquf1JHF5z7wYo1Me4KveDEORCC4",
  authDomain: "callnotifier-7e7ea.firebaseapp.com",
  databaseURL: "https://callnotifier-7e7ea-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "callnotifier-7e7ea",
  storageBucket: "callnotifier-7e7ea.firebasestorage.app",
  messagingSenderId: "165647390009",
  appId: "1:165647390009:web:b4751828e2f76a570544e8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const icon=document.getElementById("icon");
const type=document.getElementById("type");
const name=document.getElementById("name");
const number=document.getElementById("number");
const time=document.getElementById("time");

onValue(ref(db,"call"),(snapshot)=>{

    const d=snapshot.val();

    if(!d) return;

    icon.textContent=d.type==="sms"?"💬":"📞";
    type.textContent=d.type==="sms"?"SMS":"APPEL ENTRANT";

    name.textContent=d.name || "Numéro inconnu";
    number.textContent=d.number || "";

    if(d.time){

        const date=new Date(Number(d.time)*1000);

        time.textContent=date.toLocaleString();

    }

});

</script>

</body>
</html>
